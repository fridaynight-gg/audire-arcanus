[package]
name = "audire-capture"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "audire-capture"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", features = ["NSString"] }
