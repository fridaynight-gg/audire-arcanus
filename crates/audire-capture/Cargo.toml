[package]
name = "audire-capture"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "audire-capture"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-core-audio-types = "0.3.2"
objc2-core-media = { version = "0.3.2", features = ["CMSampleBuffer", "CMBlockBuffer"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSDate", "NSError", "NSObject", "NSRunLoop", "NSString"] }
objc2-screen-capture-kit = { version = "0.3.2", features = ["SCStream", "SCShareableContent"] }
